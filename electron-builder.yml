appId: com.crenv.crevn
productName: crevn
# Publish straight to a visible GitHub Release (not a hidden draft).
# The release tag/name comes from this package's version, so keep
# package.json "version" in sync with the git tag you push (e.g. v0.1.0).
publish:
  provider: github
  releaseType: release
# Vite already owns `dist/`, so electron-builder writes installers elsewhere.
directories:
  output: release
  buildResources: build
# Runtime files only: the renderer bundle and the CommonJS main process.
# electron-builder bundles production dependencies (nanoid, @libsql/client,
# drizzle-orm) automatically.
files:
  - dist/**
  - electron/**/*.cjs
  # Bundled agent skills (SKILL.md + references) ship inside the asar so the
  # skill catalog stays available and persistent across installs and updates.
  - electron/skills/**/*.md
  - package.json
# @libsql ships native .node binaries that cannot be loaded from inside the asar.
asarUnpack:
  - "**/*.node"
linux:
  target:
    - AppImage
    - deb
  category: Graphics
mac:
  target:
    - dmg
    - zip
  category: public.app-category.graphics-design
win:
  artifactName: ${productName}-Setup-${version}.${ext}
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
